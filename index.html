    <!-- WebApplication 構造化データ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ラクスカウト（RakScout）",
      "url": "https://ay-dx.github.io/RakScout/",
      "description": "楽天市場とふるさと納税から本当にお得な商品を発見する検索ツール。WAR・ISO・FIPの独自スコアでコスパ最強商品を発掘。",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "JPY"
      },
      "inLanguage": "ja"
    }
    </script>

    <!-- WebSite + SearchAction 構造化データ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://ay-dx.github.io/RakScout/",
      "name": "ラクスカウト（RakScout）",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://ay-dx.github.io/RakScout/#/list?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  </head>
  <body>
    <div id="root">
      <!-- 優先度高：SPAレンダリング改善 (静的フォールバック) -->
      <!-- Reactがマウントされると消滅しますが、JSを実行しないクローラーはこれを読み取ります -->
      <div style="padding: 20px; font-family: sans-serif; display: none;">
        <h1>ラクスカウト(RakScout) | 楽天市場のセール・お宝・ふるさと納税を一括検索</h1>
        <p>RakScoutは楽天市場とふるさと納税サイトから『お宝』商品を発見する検索ツールです。通常のランキングでは見つからない掘り出し物や、返礼品を効率的に比較できます。</p>
        <h2>3つの独自指標で商品を分析</h2>
        <ul>
          <li>WAR (Wins Above Replacement): 総合的なコストパフォーマンス</li>
          <li>ISO (Isolated Power): 隠れた名品のポテンシャル</li>
          <li>FIP (Fielding Independent Pitching): ショップの対応や配送の安定感</li>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
